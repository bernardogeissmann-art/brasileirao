<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Faz a página se ajustar à largura do celular. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prob.com · Chances do Brasileirão 2026</title>
  <meta name="description" content="Chances de título, Libertadores, Sul-Americana e rebaixamento no Brasileirão Série A 2026, calculadas com 10.000 simulações.">
  <meta name="theme-color" content="#14161a">
  <!-- Ícone da aba: a bolinha verde-limão da marca. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314161a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c8f03c'/%3E%3C/svg%3E">

  <!-- Fonte Archivo (Google Fonts), com larguras de 62% a 125%. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">

  <!-- Visual: primeiro as variáveis, depois o geral, as peças e a página. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/inicio.css">

  <!-- type="module" permite usar import/export entre os arquivos JavaScript. -->
  <script type="module" src="js/inicio.js"></script>
</head>
<body>
  <!-- Topo e rodapé são preenchidos pelo JavaScript (iguais em todas as páginas). -->
  <header class="topo" id="topo"></header>

  <main>
    <section class="abertura">
      <div class="largura">
        <p class="abertura__chapeu" id="chapeu">Brasileirão Série A 2026</p>
        <h1 class="abertura__titulo">Quem <span class="leva">leva</span>.<br>Quem <span class="vazado">cai</span>.</h1>
        <p class="abertura__texto">As chances de cada time, calculadas simulando 10.000 vezes os jogos que ainda faltam.</p>
        <div class="destaques" id="destaques"></div>
      </div>
    </section>

    <section class="classificacao" aria-labelledby="titulo-classificacao">
      <div class="largura">
        <div class="classificacao__topo">
          <h2 class="titulo-secao" id="titulo-classificacao">Tabela e chances</h2>
          <div id="legenda"></div>
        </div>

        <!-- A legenda e o cabeçalho das colunas vêm de componentes.js (iguais no simulador). -->
        <div class="tabela-chances">
          <div id="cabecalho-colunas"></div>
          <ol class="lista-times" id="lista-times"></ol>
        </div>
        <p class="nota" id="nota"></p>
      </div>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>
</body>
</html>
