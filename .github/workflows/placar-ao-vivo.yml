# placar-ao-vivo.yml
# Placar dos jogos do dia enquanto eles acontecem.
#   1) A cada 5 minutos, no horário em que costuma ter jogo, o GitHub confere se há algum
#      jogo do Brasileirão rolando (do horário marcado até 130 minutos depois).
#   2) Se não houver, para por aí (leva uns segundos).
#   3) Se houver, busca o placar e o minuto na ESPN e republica o site com o placar novo.
#
# Custo: o repositório é público, e para repositórios públicos o GitHub Actions é grátis.
# Observação: o GitHub não garante o horário exato das rotinas agendadas; em horários de
# muito movimento, uma rodada pode atrasar alguns minutos.

name: Placar ao vivo

on:
  schedule:
    # A cada 5 minutos, das 14h às 2h55 UTC = das 11h às 23h55 de Brasília.
    # (Formato "minuto hora dia mês dia-da-semana"; "*/5" = a cada 5 minutos.)
    - cron: "*/5 14-23,0-2 * * *"
  # Botão "Run workflow" na aba Actions, para testar na hora.
  workflow_dispatch:

# Se uma rodada demorar e a próxima começar, a nova espera (e só a mais recente fica na fila).
concurrency:
  group: placar-ao-vivo
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # TAREFA 1: tem jogo rolando agora?
  # -------------------------------------------------------------------------
  verificar:
    name: Conferir se tem jogo rolando
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tem_jogo: ${{ steps.placar.outputs.tem_jogo }}
    steps:
      - name: Pegar o código e os dados
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Ver se tem jogo agora (e o placar)
        id: placar
        run: python3 scripts/placar_ao_vivo.py

  # -------------------------------------------------------------------------
  # TAREFA 2: só se tiver jogo, republicar o site com o placar de agora
  # -------------------------------------------------------------------------
  publicar:
    name: Publicar o placar
    needs: verificar
    if: needs.verificar.outputs.tem_jogo == 'true'
    runs-on: ubuntu-latest
    # A mesma "fila" da publicação normal: uma publicação nunca atropela a outra.
    concurrency:
      group: publicar-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Pegar o código e os dados
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Buscar o placar de agora
        run: python3 scripts/placar_ao_vivo.py --publicando

      - name: Montar a pasta do site
        run: bash scripts/montar_site.sh

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar a pasta do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5
